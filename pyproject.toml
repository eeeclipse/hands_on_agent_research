[project]
name = "research-digest-agent"
version = "0.1.0"
description = "프로필 기반 주간 리서치 다이제스트 자동화 에이전트"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.84.0",
    "beautifulsoup4>=4.14.0",
    "faiss-cpu>=1.13.0",
    "feedparser>=6.0.0",
    "jinja2>=3.1.0",
    "numpy<2",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "rich>=14.0.0",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
