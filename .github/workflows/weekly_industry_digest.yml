name: Weekly Industry Practice Digest

on:
  schedule:
    # 매주 월요일 오전 9시 KST (= 월요일 00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: '수집 기간 (일)'
        required: false
        default: '7'
      threshold:
        description: '관련성 임계값 (0~1)'
        required: false
        default: '0.35'

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Run Industry Practice Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          THRESHOLD="${{ github.event.inputs.threshold || '0.35' }}"
          uv run agent.py --profile industry --days "$DAYS" --threshold "$THRESHOLD"

      - name: Get newsletter path
        id: newsletter
        run: |
          FILE=$(ls -t output/industry_digest_*.md 2>/dev/null | head -1 || true)
          if [ -n "$FILE" ]; then
            echo "path=$FILE" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "$FILE")" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ 다이제스트 파일이 생성되지 않았습니다 (임계값 이상 항목 없음)"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push newsletter
        if: steps.newsletter.outputs.found == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "변경된 파일 없음 — 커밋 스킵"
          else
            git commit -m "digest(industry): ${{ steps.newsletter.outputs.name }}"
            git push
          fi

      - name: Notify Discord
        if: steps.newsletter.outputs.found == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEWSLETTER_PATH:     ${{ steps.newsletter.outputs.path }}
        run: uv run .github/scripts/notify_discord.py

      - name: Notify Discord on failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          run_url = sys.argv[1]
          url = os.environ.get("DISCORD_WEBHOOK_URL", "")
          if not url:
              print("DISCORD_WEBHOOK_URL not set, skipping notification")
              sys.exit(0)
          payload = {
              "username": "Research Digest Bot",
              "embeds": [{
                  "title": "Industry Practice Digest 실패",
                  "description": (
                      f"워크플로우 실행 중 오류가 발생했습니다.\n"
                      f"[Actions 로그 확인]({run_url})"
                  ),
                  "color": 0xFF4444,
              }]
          }
          body = json.dumps(payload).encode()
          req = urllib.request.Request(url, data=body,
                headers={"Content-Type": "application/json"}, method="POST")
          try:
              urllib.request.urlopen(req, timeout=10)
          except urllib.error.HTTPError as e:
              print(f"Discord 알림 전송 실패: HTTP {e.code}", file=sys.stderr)
          PYEOF
