name: Daily PhD Research Digest

on:
  schedule:
    # 매일 오전 9시 KST (= 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '수집 기간 (일)'
        required: false
        default: '1'
      threshold:
        description: '관련성 임계값 (0~1)'
        required: false
        default: '0.35'

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 뉴스레터 파일 커밋·푸시 권한

    steps:
      # ── 1. 체크아웃 ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 환경 설정 ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "numpy<2" anthropic feedparser sentence-transformers faiss-cpu \
                      scikit-learn python-dotenv rich jinja2 requests beautifulsoup4

      # ── 3. Agent 실행 (뉴스레터 생성) ────────────────────────────────────────
      - name: Run Research Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days || '1' }}"
          THRESHOLD="${{ github.event.inputs.threshold || '0.35' }}"
          python agent.py --days "$DAYS" --threshold "$THRESHOLD"

      # ── 4. 생성된 뉴스레터 파일 경로 추출 ────────────────────────────────────
      - name: Get newsletter path
        id: newsletter
        run: |
          FILE=$(ls -t output/phd_digest_*.md | head -1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $FILE)" >> "$GITHUB_OUTPUT"

      # ── 5. 뉴스레터 커밋 & 푸시 ──────────────────────────────────────────────
      - name: Commit and push newsletter
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "변경된 파일 없음 — 커밋 스킵"
          else
            git commit -m "digest: ${{ steps.newsletter.outputs.name }}"
            git push
          fi

      # ── 6. Discord 알림 ───────────────────────────────────────────────────────
      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEWSLETTER_PATH:     ${{ steps.newsletter.outputs.path }}
        run: python .github/scripts/notify_discord.py

      # ── 7. 실패 시 Discord 오류 알림 ─────────────────────────────────────────
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DATE=$(date '+%Y-%m-%d')
          python - "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" <<'EOF'
          import json, os, sys, urllib.request
          run_url = sys.argv[1]
          url = os.environ["DISCORD_WEBHOOK_URL"]
          payload = {
              "username": "Research Digest Bot",
              "embeds": [{
                  "title": "❌ PhD Research Digest 실패",
                  "description": (
                      f"워크플로우 실행 중 오류가 발생했습니다.\n"
                      f"[Actions 로그 확인]({run_url})"
                  ),
                  "color": 0xFF4444,
              }]
          }
          body = json.dumps(payload).encode()
          req = urllib.request.Request(url, data=body,
                headers={"Content-Type": "application/json"}, method="POST")
          urllib.request.urlopen(req, timeout=10)
          EOF
