name: Weekly PhD Research Digest

on:
  schedule:
    # 매주 월요일 오전 8시 KST (= 일요일 23:00 UTC)
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: '수집 기간 (일)'
        required: false
        default: '7'
      threshold:
        description: '관련성 임계값 (0~1)'
        required: false
        default: '0.35'

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "numpy<2" anthropic feedparser sentence-transformers faiss-cpu \
                      scikit-learn python-dotenv rich jinja2 requests beautifulsoup4

      - name: Run PhD Research Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          THRESHOLD="${{ github.event.inputs.threshold || '0.35' }}"
          python agent.py --profile phd --days "$DAYS" --threshold "$THRESHOLD"

      - name: Get newsletter path
        id: newsletter
        run: |
          FILE=$(ls -t output/phd_digest_*.md | head -1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $FILE)" >> "$GITHUB_OUTPUT"

      - name: Commit and push newsletter
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "변경된 파일 없음 — 커밋 스킵"
          else
            git commit -m "digest(phd): ${{ steps.newsletter.outputs.name }}"
            git push
          fi

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEWSLETTER_PATH:     ${{ steps.newsletter.outputs.path }}
        run: python .github/scripts/notify_discord.py

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" <<'EOF'
          import json, os, sys, urllib.request
          run_url = sys.argv[1]
          url = os.environ["DISCORD_WEBHOOK_URL"]
          payload = {
              "username": "Research Digest Bot",
              "embeds": [{
                  "title": "PhD Research Digest 실패",
                  "description": (
                      f"워크플로우 실행 중 오류가 발생했습니다.\n"
                      f"[Actions 로그 확인]({run_url})"
                  ),
                  "color": 0xFF4444,
              }]
          }
          body = json.dumps(payload).encode()
          req = urllib.request.Request(url, data=body,
                headers={"Content-Type": "application/json"}, method="POST")
          urllib.request.urlopen(req, timeout=10)
          EOF
